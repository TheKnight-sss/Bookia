name: bookia
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.8.1

dependencies:
  device_preview: ^1.3.1
  dio: ^5.9.0
  flutter:
    sdk: flutter
  flutter_svg: ^2.2.1
  gap: ^3.0.1
  go_router: ^16.2.4

dev_dependencies:
  flutter_lints: ^5.0.0

  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true

  assets:
    - assets/images/alif-caesar-rizqi-pratama-loUlSOXL81c-unsplash 1.png
    - assets/images/logo.svg
    - assets/images/cib_apple.svg
    - assets/images/google_ic.svg
    - assets/images/Successmark.svg
    - assets/icons/back.svg
    - assets/icons/eye.svg
    - assets/icons/Bookmark.svg
    - assets/icons/Home.svg
    - assets/icons/Logout.svg
    - assets/icons/Profile.svg
    - assets/icons/solar_camera-broken.svg
    - assets/icons/category.svg

  fonts:
    - family: DMSerifDisplay
      fonts:
        - asset: assets/fonts/DMSerifDisplay-Regular.ttf
          weight: 400
